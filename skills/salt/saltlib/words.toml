# LDNOOBW entries (saltlib/ldnoobw/) that match ordinary words or code in practice.
exclude = ["am", "sm", "xx", "13.", "del", "nicht", "fan", "trio", "poof", "aand"]

# First tokens that mark a line as a pasted shell command.
[paste]
commands = [
  "kubectl",
  "terraform",
  "tofu",
  "flux",
  "helm",
  "docker",
  "podman",
  "git",
  "uv",
